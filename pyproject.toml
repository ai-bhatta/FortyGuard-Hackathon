[project]
name = "assetshield-ai"
version = "0.1.0"
description = "Backend MVP for AssetShield AI heat-risk scoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "streamlit>=1.41.1",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.28.1",
    "pytest>=8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "api_server:app"
